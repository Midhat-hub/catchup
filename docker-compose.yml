services:
  db:
    image: pgvector/pgvector:pg16
    container_name: catchup-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-catchup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catchup_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-catchup}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-catchup} -d ${POSTGRES_DB:-catchup}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    driver: local
